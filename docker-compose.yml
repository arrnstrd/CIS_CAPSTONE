services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: cis_app

    working_dir: /var/www

    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules

    dns:
      - 1.1.1.1
      - 8.8.8.8

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: cis_nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    restart: unless-stopped

volumes:
  vendor_data:
  node_modules_data: